<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 280px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 16px;
        }

        h3 {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4fb966, #9a81e2);
            flex-shrink: 0;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .setting-label {
            font-size: 12px;
            color: #b0b0b0;
            line-height: 1.3;
            max-width: 190px;
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle .slider {
            position: absolute;
            inset: 0;
            background: #3a3a5c;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.25s ease;
        }

        .toggle .slider::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: #888;
            border-radius: 50%;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .toggle input:checked + .slider {
            background: #4fb966;
        }

        .toggle input:checked + .slider::before {
            transform: translateX(16px);
            background: #ffffff;
        }

        .footer {
            margin-top: 12px;
            font-size: 10px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>Email Highlighter</h3>

    <div class="setting-row">
        <span class="setting-label">Clear highlights after reading</span>
        <label class="toggle">
            <input type="checkbox" id="clearAfterRead">
            <span class="slider"></span>
        </label>
    </div>

    <div class="footer">Settings sync across tabs automatically</div>

    <script src="popup.js"></script>
</body>
</html>
